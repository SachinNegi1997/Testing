events{}
http{
  server {
    listen 80;

    server_name personalweb.in;
    ssl_certificate  /etc/letsencrypt/live/personalweb.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/personalweb.in/privkey.pem;

    location / {
        # Forward traffic to the local application port
        proxy_pass http://127.0.0.1:5006;


        # Standard headers to preserve client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Handle WebSockets if your app uses them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
                }
